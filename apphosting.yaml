      - BUILD
      - RUNTIME

  - variable: ZOHO_BANK_ACCOUNT_ID
    secret: ZOHO_BANK_ACCOUNT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: STRIPE_CLEARING_ACCOUNT_ID
    secret: STRIPE_CLEARING_ACCOUNT_ID
    availability:
      - BUILD
      - RUNTIME

  # Firebase Admin SDK (Server Only)
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - BUILD
      - RUNTIME

  # Cloudflare KV
  - variable: CLOUDFLARE_ACCOUNT_ID
    secret: CLOUDFLARE_ACCOUNT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: CLOUDFLARE_KV_NAMESPACE_ID
    secret: CLOUDFLARE_KV_NAMESPACE_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: CLOUDFLARE_API_TOKEN
    secret: CLOUDFLARE_API_TOKEN
    availability:
      - BUILD
      - RUNTIME

  # Cloudflare Turnstile (server verification)
  - variable: TURNSTILE_SECRET_KEY
    secret: TURNSTILE_SECRET_KEY
    availability:
      - BUILD
      - RUNTIME

  # Coupon System Secret
  - variable: SECRET_KEY
    secret: SECRET_KEY
    availability:
      - BUILD
      - RUNTIME

  # Sync Secret (used for analytics-sync and scheduled jobs)
  - variable: SYNC_SECRET
    secret: SYNC_SECRET
