# Settings for Backend (on Cloud Run).
runConfig:
  minInstances: 0
  timeoutSeconds: 300

env:

  # ==============================
  # 🔹 Firebase Client Config (Frontend Safe)
  # ==============================
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    secret: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_TURNSTILE_SITE_KEY
    secret: NEXT_PUBLIC_TURNSTILE_SITE_KEY
    availability:
      - BUILD
      - RUNTIME

  # ==============================
  # 🔹 Public Payment Keys (Safe for Build)
  # ==============================
  - variable: NEXT_PUBLIC_RAZORPAY_KEY_ID
    secret: NEXT_PUBLIC_RAZORPAY_KEY_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME

  # ==============================
  # 🔒 Backend Secrets (MUST be available at BUILD and RUNTIME)
  # ==============================

  # Live streaming / broadcast
  - variable: LIVE_TRACKING_PROVIDER_SECRET_KEY
    secret: LIVE_TRACKING_PROVIDER_SECRET_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: LIVE_STREAM_WORKER_URL
    secret: LIVE_STREAM_WORKER_URL
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_LIVE_STREAM_WORKER_URL
    secret: LIVE_STREAM_WORKER_URL
    availability:
      - BUILD
      - RUNTIME

  - variable: LIVE_STREAM_WORKER_SECRET
    secret: LIVE_STREAM_WORKER_SECRET
    availability:
      - BUILD
      - RUNTIME

  - variable: LIVE_STREAM_FIRESTORE_SYNC_URL
    secret: LIVE_STREAM_FIRESTORE_SYNC_URL
    availability:
      - BUILD
      - RUNTIME

  # TerraMaster WebDAV
  - variable: TERRAMASTER_WEBDAV_URL
    secret: TERRAMASTER_WEBDAV_URL
    availability:
      - BUILD
      - RUNTIME

  - variable: TERRAMASTER_WEBDAV_USERNAME
    secret: TERRAMASTER_WEBDAV_USERNAME
    availability:
      - BUILD
      - RUNTIME

  - variable: TERRAMASTER_WEBDAV_PASSWORD
    secret: TERRAMASTER_WEBDAV_PASSWORD
    availability:
      - BUILD
      - RUNTIME

  - variable: TERRAMASTER_WEBDAV_BASE_PATH
    secret: TERRAMASTER_WEBDAV_BASE_PATH
    availability:
      - BUILD
      - RUNTIME

  - variable: TERRAMASTER_WEBDAV_ALLOW_SELF_SIGNED
    secret: TERRAMASTER_WEBDAV_ALLOW_SELF_SIGNED
    availability:
      - BUILD
      - RUNTIME

  # Google Drive (folder upload + service-account fallback)
  - variable: GOOGLE_API_KEY
    secret: GOOGLE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL
    secret: GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_DRIVE_SERVICE_ACCOUNT_PRIVATE_KEY
    secret: GOOGLE_DRIVE_SERVICE_ACCOUNT_PRIVATE_KEY
    availability:
      - BUILD
      - RUNTIME

  # Razorpay
  - variable: RAZORPAY_KEY_ID
    secret: RAZORPAY_KEY_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_KEY_SECRET
    secret: RAZORPAY_KEY_SECRET
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_WEBHOOK_SECRET
    secret: RAZORPAY_WEBHOOK_SECRET
    availability:
      - BUILD
      - RUNTIME

  # Stripe
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - BUILD
      - RUNTIME

  # Brevo
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
    availability:
      - BUILD
      - RUNTIME

  # AiSensy
  - variable: AISENSY_API_KEY
    secret: AISENSY_API_KEY
    availability:
      - BUILD
      - RUNTIME

  # Zoho Books
  - variable: ZOHO_CLIENT_ID
    secret: ZOHO_CLIENT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: ZOHO_CLIENT_SECRET
    secret: ZOHO_CLIENT_SECRET
    availability:
      - BUILD
      - RUNTIME

  - variable: ZOHO_REFRESH_TOKEN
    secret: ZOHO_REFRESH_TOKEN
    availability:
      - BUILD
      - RUNTIME

  - variable: ZOHO_ORG_ID
    secret: ZOHO_ORG_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: ZOHO_API_DOMAIN
    secret: ZOHO_API_DOMAIN
    availability:
      - BUILD
      - RUNTIME

  - variable: ZOHO_GST_INTRASTATE_ID
    secret: ZOHO_GST_INTRASTATE_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: ZOHO_GST_INTERSTATE_ID
    secret: ZOHO_GST_INTERSTATE_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: ZOHO_GST5_INTRASTATE_ID
    secret: ZOHO_GST5_INTRASTATE_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: ZOHO_GST5_INTERSTATE_ID
    secret: ZOHO_GST5_INTERSTATE_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: ZOHO_RAZORPAY_CLEARING_ACCOUNT_ID
    secret: ZOHO_RAZORPAY_CLEARING_ACCOUNT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: ZOHO_PAYMENT_GATEWAY_EXPENSE_ACCOUNT_ID
    secret: ZOHO_PAYMENT_GATEWAY_EXPENSE_ACCOUNT_ID
