services:
  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    container_name: cloudflared-bergman
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TUNNEL_METRICS: "0.0.0.0:2000"