# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Firebase Client-Side Config Secrets
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    secret: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    availability:
      - BUILD
      - RUNTIME

  # Server-Side API Key Secrets for OTP and other services
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: AISENSY_API_KEY
    secret: AISENSY_API_KEY
    availability:
      - BUILD
      - RUNTIME
  
  # Razorpay API Key Secrets (NEXT_PUBLIC_ for client-side, direct for server-side)
  - variable: NEXT_PUBLIC_RAZORPAY_KEY_ID
    secret: NEXT_PUBLIC_RAZORPAY_KEY_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: RAZORPAY_KEY_SECRET
    secret: RAZORPAY_KEY_SECRET
    availability:
      - RUNTIME
      
  # Stripe API Key Secrets
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  # Zoho Books API Secrets
  - variable: ZOHO_CLIENT_ID
    secret: ZOHO_CLIENT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: ZOHO_CLIENT_SECRET
    secret: ZOHO_CLIENT_SECRET
    availability:
      - BUILD
      - RUNTIME
  - variable: ZOHO_REFRESH_TOKEN
    secret: ZOHO_REFRESH_TOKEN
    availability:
      - BUILD
      - RUNTIME
  - variable: ZOHO_ORG_ID
    secret: ZOHO_ORG_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: ZOHO_API_DOMAIN
    secret: ZOHO_API_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: ZOHO_GST_INTRASTATE_ID
    secret: ZOHO_GST_INTRASTATE_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: ZOHO_GST_INTERSTATE_ID
    secret: ZOHO_GST_INTERSTATE_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: ZOHO_GST5_INTRASTATE_ID
    secret: ZOHO_GST5_INTRASTATE_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: ZOHO_GST5_INTERSTATE_ID
    secret: ZOHO_GST5_INTERSTATE_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: ZOHO_RAZORPAY_CLEARING_ACCOUNT_ID
    secret: ZOHO_RAZORPAY_CLEARING_ACCOUNT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: ZOHO_PAYMENT_GATEWAY_EXPENSE_ACCOUNT_ID
    secret: ZOHO_PAYMENT_GATEWAY_EXPENSE_ACCOUNT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_CLEARING_ACCOUNT_ID
    secret: STRIPE_CLEARING_ACCOUNT_ID
    availability:
      - BUILD
      - RUNTIME

  # Firebase Admin SDK Credentials (ensure these secret names match those in Secret Manager)
  - variable: FIREBASE_PROJECT_ID 
    secret: FIREBASE_PROJECT_ID 
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - BUILD
      - RUNTIME
  
  # Cloudflare KV Secrets
  - variable: CLOUDFLARE_ACCOUNT_ID
    secret: CLOUDFLARE_ACCOUNT_ID
    availability:
      - RUNTIME
  - variable: CLOUDFLARE_KV_NAMESPACE_ID
    secret: CLOUDFLARE_KV_NAMESPACE_ID
    availability:
      - RUNTIME
  - variable: CLOUDFLARE_API_TOKEN
    secret: CLOUDFLARE_API_TOKEN
    availability:
      - RUNTIME
  # Coupon Secret Key
  - variable: COUPON_SECRET_KEY
    secret: COUPON_SECRET_KEY
    availability:
      - RUNTIME
